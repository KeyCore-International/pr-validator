name: PR Validation

# THE PRODUCT. Consuming repositories call this workflow; everything else in
# this repository exists to serve it.
#
# Public contract — inputs and secrets below. Changing them incompatibly means
# a new major tag; the `v1` tag must never start behaving differently for the
# repositories already pinned to it.
#
# The caller needs:
#   permissions: { contents: read, pull-requests: write }
#   secrets: each one named explicitly — see docs/INSTALL.md. `secrets: inherit`
#            only propagates within one organization, and most consumers of this
#            workflow are in another one.

on:
  workflow_call:
    inputs:
      checks:
        description: >-
          Comma-separated checks to run: criteria, security, rules, quality,
          duplication, tests. Empty means the repository's `.pr-validator.json`
          decides, and failing that, all of them.
        type: string
        required: false
        default: ''
      base:
        description: 'Base branch the pull request targets'
        type: string
        required: false
        default: 'develop'
      config-path:
        description: 'Per-repository configuration file'
        type: string
        required: false
        default: '.pr-validator.json'
      node-version:
        description: 'Node version used to run the checks'
        type: string
        required: false
        default: '20'
      runs-on:
        description: 'Runner label for the check jobs'
        type: string
        required: false
        default: 'ubuntu-latest'
    secrets:
      # Needed by every AI check, but declared `required: false` on purpose.
      # `required: true` makes GitHub reject the call before a single job
      # starts — "Secret AI_GATEWAY_API_KEY is required, but not provided" —
      # which turns a missing credential into a red, blocking failure with no
      # comment explaining it. That is exactly the outcome this gate promises
      # never to produce. Declared optional, the checks run and `run-check`
      # reports the absence as a tool error: a visible warning that names the
      # secret and lets the merge through.
      AI_GATEWAY_API_KEY:
        description: 'AI gateway key. Needed by every AI check.'
        required: false
      TASKS_API_EMAIL:
        description: 'Read-only task-manager service account. Only for the criteria check.'
        required: false
      TASKS_API_PASSWORD:
        description: 'Password for that service account.'
        required: false

jobs:
  setup:
    name: Resolve checks
    runs-on: ${{ inputs.runs-on }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      # The repository is checked out because the check list can also come from
      # its `.pr-validator.json`. Shallow: this job reads one file.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      # An action rather than an inline script, so the list of valid names comes
      # from the check registry instead of a string duplicated into YAML. A name
      # list that lives in two places disagrees with itself the first time
      # somebody adds a check.
      - id: matrix
        uses: KeyCore-International/pr-validator/actions/resolve-checks@v4
        with:
          checks: ${{ inputs.checks }}
          config-path: ${{ inputs.config-path }}

  checks:
    name: ${{ matrix.check }}
    needs: setup
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.setup.outputs.matrix) }}
    # One output per check, and one line each, because output names cannot be
    # computed. Every matrix instance writes only its own key and leaves the
    # rest empty; GitHub merges the instances and an empty value never
    # overwrites a filled one, so `report` sees every one of them.
    #
    # The verdicts used to travel as artifacts, which is the obvious design and
    # the wrong one: uploading needs Actions storage, and an organization that
    # ran out of it saw every check go red with no comment explaining why. A
    # storage quota is not a code problem and must not gate a merge. Job
    # outputs cost nothing and cannot run out.
    #
    # Adding a check therefore means adding one line here. See AGENTS.md.
    outputs:
      criteria: ${{ steps.emit.outputs.criteria }}
      security: ${{ steps.emit.outputs.security }}
      rules: ${{ steps.emit.outputs.rules }}
      quality: ${{ steps.emit.outputs.quality }}
      duplication: ${{ steps.emit.outputs.duplication }}
      tests: ${{ steps.emit.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # Pinned to the SAME major this workflow ships under. A workflow published
      # as v3 that called the v2 action would run the previous release's bundles
      # and every change in v3 would be invisible to the consumer, with nothing
      # in the logs to say so. The pin must move with every major.
      - name: Run ${{ matrix.check }}
        id: run
        uses: KeyCore-International/pr-validator/actions/run-check@v4
        with:
          check: ${{ matrix.check }}
          base: origin/${{ inputs.base }}
          config-path: ${{ inputs.config-path }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          TASKS_API_URL: ${{ vars.TASKS_API_URL }}
          TASKS_API_EMAIL: ${{ secrets.TASKS_API_EMAIL }}
          TASKS_API_PASSWORD: ${{ secrets.TASKS_API_PASSWORD }}
          PR_VALIDATOR_MODEL: ${{ vars.PR_VALIDATOR_MODEL }}

      # Emit BEFORE gating. The gate below can fail the job, and a failed job
      # would never reach this step — the consolidated comment would lose this
      # check and show it as "sin resultado".
      - name: Emit verdict
        id: emit
        if: always()
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          if [ ! -f verdict.json ]; then
            echo "::warning::$CHECK no produjo verdict.json."
            exit 0
          fi
          # Heredoc delimiter, because the verdict is JSON spanning many lines.
          # The marker is long enough that it cannot collide with the content.
          #
          # `printf '%s\n' "$(cat ...)"` and not plain `cat`: run-check writes
          # the file with no trailing newline, so `cat` would leave the closing
          # brace and the delimiter on the same line and the runner would reject
          # the whole output file — "Matching delimiter not found". Command
          # substitution strips trailing newlines and printf puts back exactly
          # one, which is what the format requires.
          {
            echo "$CHECK<<PR_VALIDATOR_VERDICT_EOF"
            printf '%s\n' "$(cat verdict.json)"
            echo "PR_VALIDATOR_VERDICT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Gate
        if: always()
        shell: bash
        env:
          BLOCKING: ${{ steps.run.outputs.blocking-failure }}
          STATUS: ${{ steps.run.outputs.status }}
          CHECK: ${{ matrix.check }}
        run: |
          case "$STATUS" in
            tool-error)
              echo "::warning::$CHECK: error de herramienta — no bloquea." ;;
            skipped)
              echo "$CHECK: omitido." ;;
          esac
          if [ "$BLOCKING" = "true" ]; then
            echo "::error::$CHECK no pasó — ver el comentario del PR."
            exit 1
          fi
          echo "$CHECK OK."

  report:
    name: Reporte
    needs: [setup, checks]
    # `always()` so the comment includes the checks that failed, not just the
    # ones that passed.
    if: always()
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # The report action still reads a directory of verdicts; only the
      # transport changed. Rebuilding the files here keeps `report.mjs` and its
      # tests untouched, and keeps the on-disk shape available for debugging.
      - name: Materialise verdicts
        shell: bash
        env:
          CRITERIA: ${{ needs.checks.outputs.criteria }}
          SECURITY: ${{ needs.checks.outputs.security }}
          RULES: ${{ needs.checks.outputs.rules }}
          QUALITY: ${{ needs.checks.outputs.quality }}
          DUPLICATION: ${{ needs.checks.outputs.duplication }}
          TESTS: ${{ needs.checks.outputs.tests }}
        run: |
          mkdir -p verdicts
          for check in criteria security rules quality duplication tests; do
            var=$(echo "$check" | tr '[:lower:]' '[:upper:]')
            body=${!var}
            [ -n "$body" ] || continue
            mkdir -p "verdicts/verdict-$check"
            printf '%s' "$body" > "verdicts/verdict-$check/verdict.json"
            echo "verdict de $check recuperado."
          done

      - name: Publish consolidated comment
        uses: KeyCore-International/pr-validator/actions/report@v4
        with:
          verdicts-dir: verdicts
          # The RESOLVED list, not the raw input: the input may be empty, and
          # this is what tells the comment which checks were expected and are
          # therefore missing when a job dies without emitting a verdict.
          # The `|| '[]'` matters: if `setup` itself died, the output is empty
          # and `fromJSON('')` would fail the expression, losing the comment
          # that explains what went wrong.
          checks: ${{ join(fromJSON(needs.setup.outputs.matrix || '[]'), ',') }}
